name: atelier-aws

x-api: &api
  image: ${BACKEND_IMAGE:?Set an immutable ECR image tag}
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: 4000
    NODE_EXTRA_CA_CERTS: /certs/global-bundle.pem
    TRUST_PROXY_HOPS: 1
  volumes:
    - ./certs:/certs:ro
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  backend:
    <<: *api
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  migrate:
    <<: *api
    profiles: [tools]
    command: [npm, run, migrate]
  seed:
    <<: *api
    profiles: [tools]
    command: [npm, run, seed]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the API DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
