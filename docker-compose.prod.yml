services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: atelier
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    image: ${DOCKERHUB_USERNAME}/material-kit-react-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://atelier:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/atelier
    command: ["npm", "run", "migrate"]
    depends_on:
      db:
        condition: service_healthy
  seed:
    image: ${DOCKERHUB_USERNAME}/material-kit-react-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://atelier:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/atelier
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD_B64: ${ADMIN_PASSWORD_B64:?Set ADMIN_PASSWORD_B64}
    command: ["npm", "run", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  backend:
    image: ${DOCKERHUB_USERNAME}/material-kit-react-backend:${IMAGE_TAG:-latest}
    environment:
      PORT: 4000
      DATABASE_URL: postgres://atelier:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/atelier
      NODE_ENV: production
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to the HTTPS frontend origin}
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    image: ${DOCKERHUB_USERNAME}/material-kit-react-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
